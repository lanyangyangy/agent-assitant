[project]
name = "backend-mvp-agent"
version = "0.1.0"
description = "基于 FastAPI 和 Qwen Plus 的流式工具调用 Agent 后端 MVP。"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 真实外部 API 冒烟测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"
